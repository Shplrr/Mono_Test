<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="Интерактивный пролёт через трёхмерный интерьер">
  <title>Room / Spatial Study</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="experience" aria-label="Интерактивный пролёт через трёхмерную комнату">
    <div class="viewport" id="viewport">
      <canvas id="roomCanvas" aria-hidden="true"></canvas>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <span class="loading__label">Загрузка пространства</span>
        <span class="loading__track"><i id="loadingBar"></i></span>
      </div>
      <div class="error" id="error" role="alert" hidden>
        <p>Не удалось загрузить 3D-модель.</p>
        <small>Обновите страницу и проверьте подключение к интернету.</small>
      </div>
      <div class="scroll-cue" id="scrollCue" aria-hidden="true"><span></span></div>
      <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </div>
  </main>
  <script defer src="bundle.js"></script>
</body>
</html>
